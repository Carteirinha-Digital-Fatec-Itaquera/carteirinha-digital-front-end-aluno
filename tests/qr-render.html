<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QR Projection Test Harness</title>
</head>
<body style="background:#ffffff; margin:0; display:flex; align-items:center; justify-content:center; height:100vh;">
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import ReactDOM from 'react-dom/client';
    import { QRCodeSVG } from 'qrcode.react';

    const params = new URLSearchParams(window.location.search);
    const value = params.get('value') || '';

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement('div', { 'data-testid': 'qr-wrapper', style: { padding: '20px', background: '#fff' } },
        React.createElement(QRCodeSVG, {
          value,
          size: 250,
          level: 'M',
          bgColor: '#ffffff',
          fgColor: '#000000',
          includeMargin: true,
          'data-testid': 'attendance-qr'
        })
      )
    );
  </script>
</body>
</html>
